sonar.projectKey=angelhc123_coswim
sonar.organization=angelhc123

sonar.sources=lib,backend/src
sonar.tests=test,backend/test
sonar.exclusions=backend/node_modules/**,build/**,.dart_tool/**

# Cobertura de Dart — el workflow corre "flutter test --coverage" antes del
# scan para que este archivo exista (ver .github/workflows/sonar.yml).
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Cobertura del backend: "npm run test:coverage" en backend/ (ver sonar.yml).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
