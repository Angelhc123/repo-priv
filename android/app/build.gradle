plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.coswim"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.coswim"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Pinned to match the version the `health` plugin itself bundles (see
    // health-13.1.3/android/build.gradle). Anything from 1.1.0-beta02 up
    // requires compileSdk 36 + AGP 8.9.1, which this project's toolchain
    // (compileSdk 35 / AGP 8.2.1) doesn't meet. ExerciseLap/ExerciseSegment
    // (used in MainActivity.kt for pool laps) are already present here.
    implementation "androidx.health.connect:connect-client:1.1.0-alpha11"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
